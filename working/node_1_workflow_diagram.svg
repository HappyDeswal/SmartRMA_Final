<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <defs>
    <linearGradient id="bg-n1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card-n1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glow-n1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <marker id="arr-n1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="url(#bg-n1)"/>
  
  <!-- Title Block -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC" text-anchor="middle">NODE 1: INGEST GATEWAY &amp; DETERMINISTIC DECISION ROUTER</text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Service Port :8000 • EXIF Forensic Audit • 64-bit pHash Duplicate Detection • Tier Boundary Matrix • SHA-256 Ledger</text>

  <!-- Step 1: Ingest Intake Form -->
  <g transform="translate(60, 90)">
    <rect width="260" height="110" rx="12" fill="url(#card-n1)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#38BDF8">1. Client Intake Submission</text>
    <text x="20" y="56" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Order Reference ID &amp; Serial Number</text>
    <text x="20" y="74" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Declared Value ($USD) &amp; Manufacturer</text>
    <text x="20" y="92" font-family="sans-serif" font-size="11" fill="#E2E8F0">• 5 Guided Multi-Angle Hardware Photos</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="320" y1="145" x2="380" y2="145" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-n1)"/>

  <!-- Step 2: Security & Anti-Fraud Engines -->
  <g transform="translate(380, 90)">
    <rect width="520" height="110" rx="12" fill="url(#card-n1)" stroke="#0284C7" stroke-width="1.5"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#38BDF8">2. Edge Anti-Fraud &amp; Hardware Integrity Audit</text>
    
    <!-- Sub-box A: EXIF -->
    <rect x="20" y="44" width="225" height="52" rx="8" fill="#0B132B" stroke="rgba(56,189,248,0.3)"/>
    <text x="32" y="62" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">EXIF Metadata Inspector</text>
    <text x="32" y="80" font-family="sans-serif" font-size="10" fill="#94A3B8">Sensor verify • Photoshop flag • Freshness</text>

    <!-- Sub-box B: pHash -->
    <rect x="265" y="44" width="235" height="52" rx="8" fill="#0B132B" stroke="rgba(56,189,248,0.3)"/>
    <text x="277" y="62" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">64-bit DCT Perceptual Hashing</text>
    <text x="277" y="80" font-family="sans-serif" font-size="10" fill="#94A3B8">Hamming distance &le; 4: Reused web image</text>
  </g>

  <!-- Arrow 2 down to Orchestration -->
  <line x1="640" y1="200" x2="640" y2="245" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-n1)"/>

  <!-- Step 3: Dual Microservice Orchestration -->
  <g transform="translate(160, 245)">
    <rect width="640" height="130" rx="14" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <text x="320" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="middle">3. Microservice Orchestration Bus</text>

    <!-- Call Node 3 -->
    <rect x="30" y="44" width="270" height="68" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.2"/>
    <text x="45" y="66" font-family="sans-serif" font-size="12" font-weight="700" fill="#C084FC">Call Node 3: Vision Telemetry (:8002)</text>
    <text x="45" y="84" font-family="sans-serif" font-size="10.5" fill="#E2E8F0">• Transmit 5 photo tensors</text>
    <text x="45" y="99" font-family="sans-serif" font-size="10.5" fill="#E2E8F0">• Returns Anomaly Score A &amp; Defect Pin</text>

    <!-- Call Node 2 -->
    <rect x="340" y="44" width="270" height="68" rx="8" fill="#1E293B" stroke="#00A884" stroke-width="1.2"/>
    <text x="355" y="66" font-family="sans-serif" font-size="12" font-weight="700" fill="#2DD4BF">Call Node 2: Policy RAG (:8001)</text>
    <text x="355" y="84" font-family="sans-serif" font-size="10.5" fill="#E2E8F0">• Transmit Manufacturer &amp; Symptoms</text>
    <text x="355" y="99" font-family="sans-serif" font-size="10.5" fill="#E2E8F0">• Returns CID Clause Citation &amp; Page</text>
  </g>

  <!-- Arrow 3 down to Decision Router -->
  <line x1="480" y1="375" x2="480" y2="415" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-n1)"/>

  <!-- Step 4: Decision Router -->
  <g transform="translate(120, 415)">
    <rect width="720" height="110" rx="12" fill="url(#card-n1)" stroke="#38BDF8" stroke-width="2"/>
    <text x="360" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#38BDF8" text-anchor="middle">4. Deterministic Decision Router &amp; Multi-Factor Risk Index</text>
    <text x="360" y="52" font-family="monospace" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">R = 70 &times; AnomalyScore + 20 &times; PolicyPenalty + 30 &times; FraudPenalty (Clamped 0 - 100)</text>
    <text x="360" y="74" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">SLA Tier Boundaries: Tier 1 (&lt;$300) • Tier 2 ($300-$1K) • Tier 3 ($1K-$2.5K) • Tier 4 (&gt;$2.5K Mandatory Teardown)</text>
    <text x="360" y="94" font-family="sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">&bull; Duplicate pHash detected? &rarr; Immediate Escalation &bull; CID Verified? &rarr; Rejection</text>
  </g>

  <!-- 3 Outgoing Decision Branches -->
  <line x1="240" y1="525" x2="160" y2="565" stroke="#10B981" stroke-width="2" marker-end="url(#arr-n1)"/>
  <line x1="480" y1="525" x2="480" y2="565" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-n1)"/>
  <line x1="720" y1="525" x2="800" y2="565" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-n1)"/>

  <!-- Outcome Cards -->
  <g transform="translate(70, 565)">
    <rect width="180" height="52" rx="8" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="middle">APPROVE</text>
    <text x="90" y="42" font-family="sans-serif" font-size="9.5" fill="#E2E8F0" text-anchor="middle">R &lt; 30 • Return Slip Issued</text>
  </g>

  <g transform="translate(390, 565)">
    <rect width="180" height="52" rx="8" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="90" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#F59E0B" text-anchor="middle">ESCALATE</text>
    <text x="90" y="42" font-family="sans-serif" font-size="9.5" fill="#E2E8F0" text-anchor="middle">L2 Technician Workbench</text>
  </g>

  <g transform="translate(710, 565)">
    <rect width="180" height="52" rx="8" fill="rgba(239,68,68,0.15)" stroke="#EF4444" stroke-width="1.5"/>
    <text x="90" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#EF4444" text-anchor="middle">REJECT</text>
    <text x="90" y="42" font-family="sans-serif" font-size="9.5" fill="#E2E8F0" text-anchor="middle">Verified CID Exclusion</text>
  </g>

  <!-- Step 5: Ledger Commit -->
  <g transform="translate(160, 640)">
    <rect width="640" height="42" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1"/>
    <text x="320" y="26" font-family="monospace" font-size="11.5" font-weight="600" fill="#38BDF8" text-anchor="middle">🔒 SHA-256 Cryptographic Append-Only Ledger Signed (audit_ledger.json)</text>
  </g>
</svg>
