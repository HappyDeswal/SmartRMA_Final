  <text x="480" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#D8B4FE" text-anchor="middle">Service Port :8002 • Ollama Moondream Vision LLM • Empirical Defect Reasoning • Downstream Cross-Node Transmission</text>

